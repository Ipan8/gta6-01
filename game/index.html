<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMARA HEAT — Solmara Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1420; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .panel { position: absolute; background: rgba(10,16,26,.55); border-radius: 8px; padding: 8px 12px; }
  #topleft { top: 12px; left: 12px; }
  #healthbar { width: 180px; height: 12px; background: rgba(0,0,0,.5); border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  #health-fill { height: 100%; width: 100%; background: #4ade80; }
  #cash { font-size: 22px; font-weight: 700; }
  #topright { top: 12px; right: 12px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 2px; color: #ffd23e; min-height: 32px; }
  #stars .off { color: rgba(255,255,255,.35); }
  #clock { font-size: 18px; font-weight: 600; }
  #objective { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  #bottomleft { bottom: 16px; left: 12px; font-size: 18px; font-weight: 600; }
  #minimap { position: absolute; right: 12px; bottom: 12px; width: 180px; height: 180px; border-radius: 8px; border: 2px solid rgba(255,255,255,.35); background: rgba(10,16,26,.6); }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(255,255,255,.9); display: none; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; text-align: center; opacity: 0; transition: opacity .3s; }
  #banner small { display: block; font-size: 16px; font-weight: 500; margin-top: 4px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,10,18,.88); color: #fff; text-align: center; }
  #overlay h1 { font-size: 52px; margin: 0 0 8px; letter-spacing: 2px; color: #ffd23e; }
  #overlay p { font-size: 18px; margin: 6px 0; color: #d7dee8; }
  #overlay .prompt { margin-top: 18px; font-size: 20px; color: #ffd23e; font-weight: 700; }
  #overlay.hidden { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="SOLMARA HEAT: an open-world game in Solmara Bay. Drive, walk, take jobs, outrun Bay PD."></canvas>
<div id="hud">
  <div class="panel" id="topleft">
    <div id="healthbar"><div id="health-fill"></div></div>
    <div id="cash">$250</div>
  </div>
  <div class="panel" id="topright">
    <div id="stars"></div>
    <div id="clock">08:00</div>
  </div>
  <div class="panel" id="bottomleft"><span id="ammo"></span> <span id="speed"></span></div>
  <div class="panel" id="objective">Welcome to Solmara Bay</div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="crosshair">+</div>
  <div id="banner"></div>
</div>
<div id="overlay">
  <div>
    <h1 id="overlay-title">SOLMARA HEAT</h1>
    <div id="overlay-lines"></div>
    <div class="prompt" id="overlay-prompt">Press Space or click to start</div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
